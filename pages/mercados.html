<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Mercados · Eco Go</title>
  <link rel="stylesheet" href="../assets/css/theme.css?v=202610291207"/>
  <link rel="icon" type="image/jpeg" href="../assets/img/logo-ecogo.jpg"/>
  <style>
    /* La seccion es la pagina que arma el propio Monitor de tasas, que viene
       completa y con sus estilos. Se embebe para conservar el menu del
       tablero alrededor; el alto se ajusta al contenido real por postMessage
       y, si eso no llega, queda el alto de respaldo. */
    .mk-wrap{ padding:0; }
    .mk-frame{ width:100%; border:0; display:block; min-height:1400px; background:var(--color-bg); }
    .mk-aviso{ font-size:.74rem; color:var(--color-text-muted); padding:10px 0 0; }
    .mk-aviso a{ color:var(--eg-teal); }
    @media (max-width:800px){ .mk-frame{ min-height:1800px; } }
  </style>
</head>
<body data-depth="1" data-active-section="mercados">
  <div class="eg-app">
    <aside class="eg-sidebar" id="egSidebar"></aside>
    <header class="eg-header" id="egHeader"></header>
    <main class="eg-main mk-wrap">
      <iframe id="mkFrame" class="mk-frame" src="mercados-monitor.html"
              title="Monitor de tasas · Eco Go" loading="eager"></iframe>
      <p class="mk-aviso">
        ¿Se ve cortado? <a href="mercados-monitor.html" target="_blank" rel="noopener">Abrir el monitor en una pestaña aparte</a>.
      </p>
    </main>
  </div>

  <script src="../assets/js/layout.js?v=202610291207"></script>
  <script>
  (function(){
    var f = document.getElementById('mkFrame');

    /* El monitor es una pagina completa embebida: si se deja con alto fijo,
       o sobra espacio en blanco o se corta el final. Se mide el documento de
       adentro y se ajusta. Mismo origen, asi que se puede leer. */
    function ajustar(){
      try {
        var d = f.contentDocument;
        if (!d || !d.body) return;
        var alto = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
        if (alto > 200) f.style.height = (alto + 24) + 'px';
      } catch (e) {
        /* Si algun dia la pagina pasa a servirse de otro origen, el alto de
           respaldo del CSS la sigue mostrando entera. */
      }
    }

    f.addEventListener('load', function(){
      ajustar();
      // el monitor dibuja sus graficos despues de cargar, y eso cambia el alto
      [300, 1000, 2500].forEach(function(ms){ setTimeout(ajustar, ms); });
      try {
        var d = f.contentDocument;
        if (d && window.ResizeObserver) new ResizeObserver(ajustar).observe(d.body);
      } catch (e) {}
    });
    window.addEventListener('resize', ajustar);
  })();
  </script>
</body>
</html>
